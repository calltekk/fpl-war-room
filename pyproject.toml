[project]
name = "fpl-war-room"
version = "0.1.0"
description = "Fantasy Premier League data engineering and decision platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "streamlit>=1.40,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-mock>=3.14,<4",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true
